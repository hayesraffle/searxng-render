use_default_settings:
  engines:
    # Engine mix per the 2026-07-02 pipeline audit (ThreeArch repo,
    # docs/agent-optimization/SUPERFORECASTER-ROADMAP.md):
    # - bing (general) REMOVED: its scraper degenerates multi-word queries to the
    #   first token ("U.S.-Iran peace deal…" → results for "U") and was the sole
    #   surviving general engine — the root cause of junk research reaching agents.
    # - google/duckduckgo/brave/startpage (general) REMOVED: permanently
    #   blocked/captcha'd/rate-limited from Render's shared egress IP (google fails
    #   SILENTLY with 0 results). With them gone, a general query that finds nothing
    #   returns 0 results and the bots' Serper fallback fires correctly instead of
    #   accepting junk.
    # - qwant + mojeek ADDED for general: tolerant of datacenter IPs.
    # - news engines kept to the trio measured working on-topic from this IP
    #   (bing news is fine — only bing GENERAL degenerates); reuters (401),
    #   yahoo news (protocol error), google news (dead) dropped.
    keep_only:
      - qwant
      - mojeek
      - wikipedia
      - bing news
      - duckduckgo news
      - qwant news

# keep_only preserves each engine's default disabled flag — qwant/mojeek/qwant news
# are disabled by default in this build, so they must be re-enabled explicitly
# (verified 2026-07-02: without this, general category had zero active engines).
engines:
  - name: qwant
    disabled: false
  - name: mojeek
    disabled: false
  - name: qwant news
    disabled: false

general:
  instance_name: "ThreeArch Search"
  debug: false

search:
  safe_search: 0
  autocomplete: ""
  formats:
    - json

server:
  port: 8080
  bind_address: "0.0.0.0"
  secret_key: "override-via-SEARXNG_SECRET-env-var"
  limiter: false

ui:
  static_use_hash: true
