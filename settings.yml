use_default_settings:
  engines:
    # THIS INSTANCE SERVES NEWS ONLY. General web search is intentionally empty —
    # see the 2026-08-05 note below before adding a general engine back.
    #
    # Engine mix per the 2026-07-02 pipeline audit (ThreeArch repo,
    # docs/agent-optimization/SUPERFORECASTER-ROADMAP.md):
    # - bing (general) REMOVED: its scraper degenerates multi-word queries to the
    #   first token ("U.S.-Iran peace deal…" → results for "U") and was the sole
    #   surviving general engine — the root cause of junk research reaching agents.
    # - google/duckduckgo/brave/startpage (general) REMOVED: permanently
    #   blocked/captcha'd/rate-limited from Render's shared egress IP (google fails
    #   SILENTLY with 0 results). With them gone, a general query that finds nothing
    #   returns 0 results and the bots' Serper fallback fires correctly instead of
    #   accepting junk.
    # - qwant + mojeek ADDED for general: tolerant of datacenter IPs.
    # - news engines kept to the trio measured working on-topic from this IP
    #   (bing news is fine — only bing GENERAL degenerates); reuters (401),
    #   yahoo news (protocol error), google news (dead) dropped.
    #
    # 2026-08-05 follow-up — the last three general engines have since died, so
    # they are removed rather than left to time out. Measured from Render:
    # - qwant + qwant news: "access denied" on every request (HTTP 200 from a
    #   residential IP → datacenter block, not an outage). Both dropped.
    # - mojeek: httpx.ConnectTimeout on every request, burning the full 3.0s engine
    #   timeout before returning nothing (403 from a residential IP — it refuses
    #   SearXNG either way). Dropped.
    # - wikipedia: HTTP 400. The bots send whole market titles as queries and the
    #   REST summary endpoint takes a page title, so a "/" in the question (e.g.
    #   "$95.00/barrel") breaks the path. Useless for forecasting queries anyway.
    # Net effect: general now returns 0 INSTANTLY instead of blocking ~3.2s on
    # mojeek's timeout first, so the bots' Serper fallback fires ~3s sooner on every
    # general search. Same results, same cost, less latency, no error-log spam.
    # Remaining news pair verified contributing on 4 oil queries (2026-08-05):
    # duckduckgo news 3–22 results, bing news 3–8, per query.
    keep_only:
      - bing news
      - duckduckgo news

general:
  instance_name: "ThreeArch Search"
  debug: false

search:
  safe_search: 0
  autocomplete: ""
  formats:
    - json

server:
  port: 8080
  bind_address: "0.0.0.0"
  secret_key: "override-via-SEARXNG_SECRET-env-var"
  limiter: false

ui:
  static_use_hash: true
